<!doctype html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5132">
<title>نوکری</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#f7f5f0; --card:#ffffff; --ink:#15201b; --soft:#5d6b62; --line:#dfdbd0;
    --green:#0f5132; --amber:#8a5a00; --amber-bg:#fff6e0; --red:#8f2318; --red-bg:#fdeceb;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",Segoe UI,system-ui,sans-serif;
       font-size:17px;line-height:2.1}
  header{position:sticky;top:0;z-index:5;background:var(--green);color:#fff;
         padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
  .brand{font-size:22px;font-weight:700}
  .who{display:flex;gap:8px;margin-top:9px}
  .who button{flex:1;padding:11px 8px;font-size:17px;font-family:inherit;border:0;border-radius:10px;
              background:#ffffff28;color:#fff;line-height:1.6}
  .who button[aria-pressed="true"]{background:#fff;color:var(--green);font-weight:700}
  main{padding:12px 12px calc(28px + env(safe-area-inset-bottom))}
  .safety{background:var(--amber-bg);border:1px solid #e8cf94;border-radius:12px;
          padding:12px 14px;margin-bottom:14px;font-size:17px}
  .safety b{color:var(--amber)}
  .count{color:var(--soft);font-size:15px;margin:0 0 10px}
  .install{margin:0 0 12px}
  .install button{width:100%;padding:13px;border-radius:12px;border:0;background:var(--green);
        color:#fff;font-family:inherit;font-size:17px;font-weight:700;line-height:1.8}
  .install .hint{margin:0;padding:11px 13px;background:var(--card);border:1px dashed var(--line);
        border-radius:12px;font-size:15px;color:var(--soft)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:14px;margin-bottom:13px}
  .card h2{margin:0 0 4px;font-size:19px;line-height:1.9}
  .org{color:var(--soft);font-size:15px;margin:0 0 9px}
  .rows{margin:0 0 10px}
  .row{display:flex;gap:9px;align-items:baseline;font-size:16px}
  .row .k{color:var(--soft);min-width:5.2em}
  .days{display:inline-block;padding:2px 10px;border-radius:999px;font-size:15px;
        background:#e7f0ea;color:var(--green);font-weight:700}
  .days.soon{background:var(--amber-bg);color:var(--amber)}
  .days.today{background:var(--red-bg);color:var(--red)}
  .posts{background:#eef2ea;border:1px solid var(--line);border-radius:10px;
         padding:9px 12px;margin:2px 0 10px;font-size:16px}
  .posts .label{display:block;color:var(--soft);font-size:14px;margin-bottom:2px}
  .posts ul{margin:0;padding-inline-start:20px}
  .warn{background:var(--red-bg);border:1px solid #e8b6b1;border-radius:10px;
        padding:10px 12px;margin:10px 0;font-size:16px;color:var(--red)}
  .english,.shotbox{background:#f4f2ec;border:1px solid var(--line);border-radius:10px;
           padding:8px 12px;margin:10px 0}
  .english summary,.shotbox summary{color:var(--soft);font-size:15px;cursor:pointer;
           list-style:none;padding:3px 0}
  .english summary::-webkit-details-marker,.shotbox summary::-webkit-details-marker{display:none}
  .english summary::before,.shotbox summary::before{content:'▸ ';font-size:13px}
  .english[open] summary::before,.shotbox[open] summary::before{content:'▾ '}
  .en-body{direction:ltr;text-align:left;font-family:Segoe UI,system-ui,sans-serif;
           font-size:15px;line-height:1.6;color:#2b342e;margin:6px 0 2px}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  .acts a,.acts button{flex:1;min-width:8.5em;text-align:center;padding:11px 10px;border-radius:10px;
        font-size:16px;font-family:inherit;border:1px solid var(--line);background:#fff;
        color:var(--ink);text-decoration:none;line-height:1.7}
  .acts a.primary{background:var(--green);color:#fff;border-color:var(--green);font-weight:700}
  .acts button[aria-pressed="true"]{background:#e7f0ea;border-color:var(--green);color:var(--green)}
  .shot{width:100%;border-radius:8px;border:1px solid var(--line);margin-top:8px;display:block}
  .empty{text-align:center;color:var(--soft);padding:40px 16px}
  .foot{color:var(--soft);font-size:14px;text-align:center;margin-top:18px;line-height:2}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12160f; --card:#1a1f18; --ink:#eef1e9; --soft:#9aa79c; --line:#2e362c;
      --green:#7fc39b; --amber:#e8bf72; --amber-bg:#2b2416; --red:#e79a92; --red-bg:#2d1a18;
    }
    :root:not([data-theme="light"]) header{background:#18301f}
    :root:not([data-theme="light"]) .acts a.primary,
    :root:not([data-theme="light"]) .install button{color:#12160f}
    :root:not([data-theme="light"]) .english,
    :root:not([data-theme="light"]) .shotbox{background:#151a13}
    :root:not([data-theme="light"]) .en-body{color:#d6dcd2}
    :root:not([data-theme="light"]) .posts{background:#171d16}
  }
</style>
</head>
<body>
<header>
  <div class="brand">نوکری</div>
  <div class="who" id="who" role="group" aria-label="کس کے لیے"></div>
</header>
<main>
  <div class="safety">
    <b>خبردار:</b> نوکری کے لیے کبھی پیسے نہ دیں۔ کوئی بھی ادارہ ایزی پیسہ یا جاز کیش پر
    فیس نہیں مانگتا۔ سرکاری نوکری کی فیس صرف بینک چالان سے جمع ہوتی ہے۔
  </div>
  <div id="install" class="install" hidden></div>
  <p class="count" id="count"></p>
  <div id="list"></div>
  <div class="foot" id="foot"></div>
</main>
<script src="app.js"></script>
</body>
</html>
